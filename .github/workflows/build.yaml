name: Build
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Giải nén nếu bạn upload dạng zip
        run: if [ -f ShellApp.zip ]; then unzip -oq ShellApp.zip; fi
      - name: Chọn Xcode mới nhất
        run: |
          ls /Applications | grep -i xcode || true
          NEW=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$NEW"
          xcodebuild -version
          swift --version
      - name: Cài XcodeGen
        run: brew install xcodegen
      - name: Tạo project Xcode
        working-directory: ShellApp
        run: xcodegen generate
      - name: Build (không ký)
        working-directory: ShellApp
        run: |
          set -o pipefail
          xcodebuild -project ShellApp.xcodeproj -scheme ShellApp \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            2>&1 | tee build.log || {
              echo "=================== CÁC DÒNG LỖI ==================="
              grep -E "error:" build.log | sort -u | head -40
              exit 1
            }
      - name: Đóng gói IPA
        working-directory: ShellApp
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ShellApp.app Payload/
          zip -qr ShellApp.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ShellApp-ipa
          path: ShellApp/ShellApp.ipa

  plugin:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: [sample-wasm, sample-manga, nyaa-media]
    steps:
      - uses: actions/checkout@v4
      - name: Giải nén nếu bạn upload dạng zip
        run: if [ -f ShellApp.zip ]; then unzip -oq ShellApp.zip; fi
      - name: Build plugin WASM
        working-directory: ShellApp/plugins/${{ matrix.name }}
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown
          CRATE=$(echo "${{ matrix.name }}" | tr - _)
          mkdir -p out
          cp target/wasm32-unknown-unknown/release/$CRATE.wasm out/plugin.wasm
          cp manifest.json out/
          python3 - <<'PYEOF'
          import json, base64
          m = json.load(open('manifest.json'))
          w = base64.b64encode(open('out/plugin.wasm', 'rb').read()).decode()
          json.dump({"manifest": m, "wasm": w}, open('out/' + m['id'] + '.plugin.json', 'w'))
          PYEOF
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ShellApp/plugins/${{ matrix.name }}/out
