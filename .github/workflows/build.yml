name: Build
on:
  workflow_dispatch: {}
  push:
    branches: [main]
jobs:
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Giải nén nếu bạn upload dạng zip
        run: if [ -f ShellApp.zip ]; then unzip -oq ShellApp.zip; fi
      - name: Chọn Xcode mới nhất
        run: |
          ls /Applications | grep -i xcode || true
          NEW=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$NEW"
          xcodebuild -version
          swift --version
      - name: Cài XcodeGen
        run: brew install xcodegen
      - name: Tạo project Xcode
        working-directory: ShellApp
        run: xcodegen generate
      - name: Build (không ký)
        working-directory: ShellApp
        run: |
          set -o pipefail
          xcodebuild -project ShellApp.xcodeproj -scheme ShellApp \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build \
            2>&1 | tee build.log || {
              echo "=================== CÁC DÒNG LỖI ==================="
              grep -E "error:" build.log | sort -u | head -40
              exit 1
            }
      - name: Đóng gói IPA
        working-directory: ShellApp
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ShellApp.app Payload/
          zip -qr ShellApp.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ShellApp-ipa
          path: ShellApp/ShellApp.ipa

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giải nén nếu bạn upload dạng zip
        run: if [ -f ShellApp.zip ]; then unzip -oq ShellApp.zip; fi
      - name: Build plugin WASM
        working-directory: ShellApp/plugins/sample-wasm
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown
          mkdir -p out
          cp target/wasm32-unknown-unknown/release/sample_wasm.wasm out/plugin.wasm
          cp manifest.json out/
      - uses: actions/upload-artifact@v4
        with:
          name: sample-wasm
          path: ShellApp/plugins/sample-wasm/out
